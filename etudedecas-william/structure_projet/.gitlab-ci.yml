# .gitlab-ci.yml
stages:
  - test
  - build
  - quality
  - security
  - push
  - deploy

variables:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/foodfast-${CI_ENVIRONMENT_NAME}"
  DOCKER_IMAGE: ${ECR_REPOSITORY}:${CI_COMMIT_SHORT_SHA}
  KUBE_NAMESPACE: foodfast-${CI_ENVIRONMENT_NAME}

.aws_login: &aws_login
  - aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

.setup_kubectl: &setup_kubectl
  - aws eks update-kubeconfig --name foodfast-${CI_ENVIRONMENT_NAME} --region ${AWS_REGION}

default:
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache curl python3 py3-pip
    - pip3 install awscli
    - curl -LO https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl
    - chmod +x ./kubectl && mv ./kubectl /usr/local/bin/

test:
  stage: test
  image: node:18-alpine
  script:
    - npm ci
    - npm test
  cache:
    paths:
      - node_modules/

build:
  stage: build
  script:
    - docker build -t ${DOCKER_IMAGE} .
    - docker tag ${DOCKER_IMAGE} ${DOCKER_IMAGE}

sonarqube:
  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true

trivy:
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy image ${DOCKER_IMAGE}
  allow_failure: true

push:
  stage: push
  script:
    - *aws_login
    - docker push ${DOCKER_IMAGE}

deploy:
  stage: deploy
  image: 
    name: argoproj/argocd-cli:latest
  script:
    - *setup_kubectl
    - argocd login argocd.foodfast.com --username ${ARGOCD_USERNAME} --password ${ARGOCD_PASSWORD} --insecure
    - |
      cat > kustomization.yaml << EOF
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
      resources:
      - kubernetes/base
      namespace: ${KUBE_NAMESPACE}
      images:
      - name: foodfast
        newName: ${DOCKER_IMAGE}
        newTag: ${CI_COMMIT_SHORT_SHA}
      EOF
    - argocd app sync foodfast-${CI_ENVIRONMENT_NAME}
  environment:
    name: $CI_COMMIT_BRANCH
    on_stop: cleanup
  only:
    - main
    - staging
    - dev

cleanup:
  stage: deploy
  script:
    - *setup_kubectl
    - argocd login argocd.foodfast.com --username ${ARGOCD_USERNAME} --password ${ARGOCD_PASSWORD} --insecure
    - argocd app delete foodfast-${CI_ENVIRONMENT_NAME} --cascade
  environment:
    name: $CI_COMMIT_BRANCH
    action: stop
  when: manual
  only:
    - main
    - staging
    - dev