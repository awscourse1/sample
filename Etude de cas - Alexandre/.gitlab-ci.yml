# .gitlab-ci.yml

stages:
  - build
  - test
  - security
  - quality
  - push
  - deploy

variables:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: ${ECR_REPOSITORY_URL}
  APP_NAME: foodfast
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  KUBE_CONFIG_PATH: ${KUBE_CONFIG_PATH}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}

.docker-login: &docker-login
  - aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REPOSITORY}

cache:
  paths:
    - node_modules/

# Build Stage
build:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - apk add --no-cache aws-cli
    - *docker-login
  script:
    - echo "Building Docker image..."
    - docker build -t ${ECR_REPOSITORY}:${CI_COMMIT_SHA} -t ${ECR_REPOSITORY}:latest ./docker
    - docker images
  except:
    - tags

# Test Stage
test:unit:
  stage: test
  image: node:18-alpine
  script:
    - echo "Running unit tests..."
    - cd src
    - npm ci
    - npm run test:unit
  coverage: '/Statements\s+:\s+(\d+.?\d*)%/'

test:integration:
  stage: test
  image: node:18-alpine
  services:
    - postgres:14-alpine
  variables:
    POSTGRES_PASSWORD: postgres
    POSTGRES_USER: postgres
    POSTGRES_DB: foodfast_test
  script:
    - echo "Running integration tests..."
    - cd src
    - npm ci
    - npm run test:integration
  except:
    - tags

# Security Stage
security:trivy:
  stage: security
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - apk add --no-cache aws-cli curl
    - *docker-login
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - echo "Scanning Docker image for vulnerabilities..."
    - trivy image --severity HIGH,CRITICAL --no-progress ${ECR_REPOSITORY}:${CI_COMMIT_SHA}
  allow_failure: true

# Quality Stage
quality:sonarqube:
  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - echo "Running SonarQube analysis..."
    - sonar-scanner -Dsonar.projectKey=${APP_NAME} -Dsonar.sources=src
  allow_failure: true

# Push Stage
push:
  stage: push
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - apk add --no-cache aws-cli
    - *docker-login
  script:
    - echo "Pushing Docker image to ECR..."
    - docker push ${ECR_REPOSITORY}:${CI_COMMIT_SHA}
    - docker push ${ECR_REPOSITORY}:latest
  only:
    - main
    - staging

# Deploy Stage
deploy:argocd:
  stage: deploy
  image: bitnami/kubectl:latest
  before_script:
    - mkdir -p ~/.kube
    - echo ${KUBE_CONFIG_BASE64} | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
  script:
    - echo "Deploying to EKS using ArgoCD..."
    # Update image tag in Kubernetes manifests
    - |
      sed -i "s|image: .*|image: ${ECR_REPOSITORY}:${CI_COMMIT_SHA}|g" k8s/deployment.yaml
    # Commit changes to GitOps repository
    - |
      git config --global user.email "gitlab-ci@example.com"
      git config --global user.name "GitLab CI"
      git clone https://${GITOPS_ACCESS_TOKEN}@gitlab.com/foodfast/gitops.git
      cd gitops
      cp -r ../k8s/* .
      git add .
      git commit -m "Update deployment to ${CI_COMMIT_SHA}"
      git push
    # Trigger ArgoCD sync (if needed)
    - |
      curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
      chmod +x /usr/local/bin/argocd
      argocd login ${ARGOCD_SERVER} --username ${ARGOCD_USERNAME} --password ${ARGOCD_PASSWORD} --insecure
      argocd app sync ${APP_NAME}
  environment:
    name: production
    url: https://app.foodfast.com
  only:
    - main