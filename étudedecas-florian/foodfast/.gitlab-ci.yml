stages:
  - sonar
  - test
  - build
  - scan
  - push
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  SONAR_HOST_URL: "https://sonarqube.example.com"
  SONAR_PROJECT_KEY: "foodfast"
  SONAR_TOKEN: $SONAR_TOKEN
  ECR_REGISTRY: "<account_id>.dkr.ecr.eu-west-3.amazonaws.com"
  KUBECONFIG: /builds/$CI_PROJECT_PATH/kubeconfig.yaml

before_script:
  - echo "Running in $CI_PIPELINE_SOURCE"

sonarqube-check:
  stage: sonar
  image: sonarsource/sonar-scanner-cli
  script:
    - sonar-scanner -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.sources=. -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN
  only:
    - merge_requests
    - main
    - dev

test:
  stage: test
  image: node:20
  script:
    - npm ci
    - npm run test
  only:
    - merge_requests
    - main
    - dev

build:
  stage: build
  image: docker:20.10
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE .
  only:
    - main
    - dev

scan:
  stage: scan
  image: aquasec/trivy:latest
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $DOCKER_IMAGE || true
  only:
    - main

push:
  stage: push
  image: docker:20.10
  services:
    - docker:dind
  script:
    - echo $AWS_ACCESS_KEY_ID | docker login -u AWS --password-stdin $ECR_REGISTRY
    - docker tag $DOCKER_IMAGE $ECR_REGISTRY/foodfast:$CI_COMMIT_SHORT_SHA
    - docker push $ECR_REGISTRY/foodfast:$CI_COMMIT_SHORT_SHA
  only:
    - main

deploy:
  stage: deploy
  image: alpine/kubectl:latest
  before_script:
    - apk add --no-cache curl git
    - curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
    - chmod +x argocd
    - mv argocd /usr/local/bin/
    - echo "$KUBECONFIG_CONTENT" > $KUBECONFIG
  script:
    - argocd login $ARGOCD_SERVER --username admin --password $ARGOCD_PASSWORD --insecure
    - argocd app sync foodfast-app
    - argocd app wait foodfast-app
  only:
    - main
